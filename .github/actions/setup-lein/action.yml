name: Setup Leiningen
description: Install Java 17 (Temurin), Leiningen, and restore the Maven cache.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - uses: DeLaGuardo/setup-clojure@13
      with:
        lein: 2.12.0
    - uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-clojure-${{ hashFiles('pocs/dispatch-api/project.clj') }}
        restore-keys: ${{ runner.os }}-clojure-
