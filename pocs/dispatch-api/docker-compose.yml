services:

  dynamodb-local:
    image: amazon/dynamodb-local:3.3.0
    container_name: dispatch-api-dynamodb
    ports:
      - "8000:8000"

  api:
    build: .
    container_name: dispatch-api
    ports:
      - "8080:8080"
    depends_on:
      - dynamodb-local
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DYNAMODB_TABLE=springfield-incidents
