  <path d="M 401 266 C 397 245 410 232 435 230 C 481 226 506 247 523 286 L 622 524 C 631 547 644 557 670 559 C 688 560 695 570 691 584 C 687 598 672 606 650 606 C 607 606 579 588 562 547 L 516 435 L 430 583 C 424 594 415 600 401 600 L 350 600 L 483 372 L 460 315 C 448 286 435 281 415 285 C 407 287 402 281 401 266 Z"
        fill="#FFFFFF" transform="translate(512 390) scale(0.74) translate(-522 -418)"/>
