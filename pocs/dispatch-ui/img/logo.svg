<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Lambda logo</title>
  <desc id="desc">A cloud shaded from bright Clojure green to deep green with a subtle blue accent and a centered white lambda.</desc>
  <defs>
    <linearGradient id="cloud-blue" x1="240" y1="150" x2="800" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7299ED"/>
      <stop offset="1" stop-color="#4167BD"/>
    </linearGradient>
    <linearGradient id="cloud-green" x1="280" y1="150" x2="820" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B0E85C"/>
      <stop offset="0.35" stop-color="#91DC47"/>
      <stop offset="0.72" stop-color="#63B132"/>
      <stop offset="1" stop-color="#357A55"/>
    </linearGradient>
    <radialGradient id="clojure-blue-accent" cx="100%" cy="100%" r="85%">
      <stop offset="0" stop-color="#5881D8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#5881D8" stop-opacity="0"/>
    </radialGradient>
    <path id="cloud" d="M 220 625 C 147 625 96 574 96 494 C 96 417 144 365 222 354 C 192 294 208 218 254 170 C 322 96 426 92 508 161 C 533 135 558 127 586 127 C 645 127 685 169 691 230 C 773 222 817 273 811 357 C 886 368 928 417 928 493 C 928 568 873 625 794 625 Z"/>
